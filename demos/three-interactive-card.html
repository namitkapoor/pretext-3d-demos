<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Card — Pretext + Three.js</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0d; }
    canvas { display: block; }

    #hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font: 600 13px/1 "Helvetica Neue", sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 208, 128, 0.85);
      pointer-events: none;
      user-select: none;
      opacity: 0;
      transition: opacity 200ms ease;
      white-space: nowrap;
    }

    #instructions {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 24px;
      font: 500 10px/1 "Helvetica Neue", sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.18);
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }
    #instructions span::before {
      content: '·';
      margin-right: 8px;
      color: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <p id="hint"></p>
  <div id="instructions">
    <span>Drag to rotate</span>
    <span>Hover to lift</span>
    <span>Click to scatter</span>
  </div>
  <script type="module" src="./three-interactive-card.ts"></script>
</body>
</html>
